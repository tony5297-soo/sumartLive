<!doctype html>
<html lang="ko">
  <head>

    <title>UI Common Fixture</title>

      body { font-family: sans-serif; margin: 0; }
      .spacer { height: 2200px; }

    <div class="spacer"></div>
    <button type="button" data-toast="공용 토스트가 표시됩니다.">토스트 보기</button>
    <div data-link="/coupon.html">쿠폰 페이지로 이동</div>
    <button type="button" class="scroll-top">맨 위로</button>
    <script src="../../assets/ui-common.js"></script>
  </body>
</html>
